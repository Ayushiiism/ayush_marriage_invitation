<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayush &amp; Vedika · 24 Nov 2026</title>
  <meta name="description" content="Wedding invitation of Ayush & Vedika — 24 November 2026">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202610301913">
</head>
<body data-view="home">
  <div class="backdrop"></div>
  <div class="photo-panel"></div>
  <!-- Background song: put your file at audio/song.mp3 -->
  <audio id="song" src="audio/song.mp3" loop preload="auto"></audio>
  <button id="music-toggle" class="music-toggle" type="button" hidden aria-label="Play music"></button>

  <!-- Home -->
  <section id="home" class="view">
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="hi">हिंदी</button>
    </div>
    <div class="landing" id="open-invite" role="button" tabindex="0">
      <h1 class="names script" data-t="names"></h1>
      <div class="divider"></div>
      <p class="date" data-t="date"></p>
      <p class="tap-hint" data-t="tap"></p>
    </div>
  </section>

  <!-- Choose family -->
  <section id="families" class="view" hidden>
    <main class="page">
      <a class="back" href="#home" data-t="home"></a>
      <h1 class="script" data-t="functionsTitle"></h1>
      <div class="divider"></div>
      <p class="subtitle" data-t="chooseFamily"></p>
      <div class="choices">
        <a class="choice" href="#groom">
          <img class="choice-photo" src="images/groom-card.jpg" alt="Ayush" style="object-position: 50% 45%">
          <div class="label script" data-t="groomSide"></div>
          <div class="who" data-t="groomFamily"></div>
        </a>
        <a class="choice" href="#bride">
          <img class="choice-photo" src="images/bride-card.jpg" alt="Vedika">
          <div class="label script" data-t="brideSide"></div>
          <div class="who" data-t="brideFamily"></div>
        </a>
      </div>
    </main>
  </section>

  <!-- Groom's functions -->
  <section id="groom" class="view" hidden>
    <main class="page">
      <a class="back" href="#families" data-t="back"></a>
      <h1 class="script" data-t="groomSide"></h1>
      <div class="divider"></div>
      <p class="subtitle" data-t="groomFunctions"></p>
      <ul class="events" data-events="groom"></ul>
    </main>
  </section>

  <!-- Bride's functions -->
  <section id="bride" class="view" hidden>
    <main class="page">
      <a class="back" href="#families" data-t="back"></a>
      <h1 class="script" data-t="brideSide"></h1>
      <div class="divider"></div>
      <p class="subtitle" data-t="brideFunctions"></p>
      <ul class="events" data-events="bride"></ul>
    </main>
  </section>

  <script src="js/app.js?v=202610301913"></script>
</body>
</html>
